services:
  - type: web
    name: kinnect-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python migrate_db.py
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRONTEND_URL
        value: https://your-app-name.vercel.app
      - key: PYTHON_VERSION
        value: 3.11.0
